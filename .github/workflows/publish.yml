name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for trusted publishing: npm exchanges this workflow's OIDC
      # token for a short-lived publish credential, so there's no NPM_TOKEN to
      # rotate. It also signs the provenance attestation tying the published
      # tarball to this workflow and commit, shown on the package page.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Published only if it would pass on main.
      - run: pnpm verify

      # Authenticates through the trusted publisher configured on npmjs.com
      # for this repo and workflow file (needs npm >= 11.5.1, bundled with
      # Node 24). Renaming this file means updating that config too.
      - run: npm publish --provenance --access public
